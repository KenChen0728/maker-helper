<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>創客小幫手</title>
<meta name="description" content="創客小幫手：拍照或選照片，自動轉成雷射雕刻檔（SVG）或 3D 列印的透光片（STL）。照片不會上傳。">
<meta name="theme-color" content="#16324a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="創客小幫手">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="創客小幫手">
<meta property="og:title" content="創客小幫手：照片變成雷雕作品，或開燈才看得到的透光片">
<meta property="og:description" content="拍照或選照片，自動產生雷射雕刻或 3D 列印的檔案。照片不會上傳。">
<meta property="og:url" content="https://kenchen0728.github.io/maker-helper/">
<meta property="og:image" content="https://kenchen0728.github.io/maker-helper/icons/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<style>
/* 課程工具箱：和黑鮪魚名牌網頁同一套（2026-11-15 比較頁選 A）——深藍版頭、牛皮紙格子底、選到的是藍色、按鈕粗框、用裝置內建的字。
   課程清單用大圖示卡片（選 A）；每堂課的段落可以收合（選 B）。 */
:root{
  color-scheme:dark;
  --bg:#171b16; --grid:rgba(214,226,190,.045); --panel:#1f241d; --surface:#262c24; --surface-2:#2f362c; --line:#3b4337; --line-2:#5a6653;
  --ink:#ece7da; --muted:#bcbea9;
  --accent:#e2803d; --accent-ink:#1d1006; --accent-text:#f0a06a; --accent-soft:#3b2a1c; --accent-line:#8d5228;
  --leaf:#9cc174; --leaf-ink:#9cc174; --leaf-soft:#26321e; --sea:#79a7e0;
  --pick:#2f6f9f; --pick-ink:#fff; --focus:#8ab4ff; --brand:#16324a; --edge:#e2803d;
  --warn-bg:#3a3120; --warn-ink:#f2d690;
  --paper:#f7f1e6; --paper-ink:#3a3122;
  --font:"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  color-scheme:light;
  --bg:#e6dccb; --grid:rgba(90,70,40,.07); --panel:#efe7d9; --surface:#f6f1e7; --surface-2:#ebe2d2; --line:#d2c3a8; --line-2:#9c8a6c;
  --ink:#2a271f; --muted:#584f3e;
  --accent:#b5561c; --accent-ink:#fff8f0; --accent-text:#9a4614; --accent-soft:#f1dcc6; --accent-line:#d99a6c;
  --leaf:#3f6a22; --leaf-ink:#3f6324; --leaf-soft:#dde6cd; --sea:#2f5fa8;
  --pick:#1f5f8b; --focus:#1f5fc4;
  --warn-bg:#f6e6bd; --warn-ink:#5d4300;
  --paper:#fffaf2;
}}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#e6dccb; --grid:rgba(90,70,40,.07); --panel:#efe7d9; --surface:#f6f1e7; --surface-2:#ebe2d2; --line:#d2c3a8; --line-2:#9c8a6c;
  --ink:#2a271f; --muted:#584f3e;
  --accent:#b5561c; --accent-ink:#fff8f0; --accent-text:#9a4614; --accent-soft:#f1dcc6; --accent-line:#d99a6c;
  --leaf:#3f6a22; --leaf-ink:#3f6324; --leaf-soft:#dde6cd; --sea:#2f5fa8;
  --pick:#1f5f8b; --focus:#1f5fc4;
  --warn-bg:#f6e6bd; --warn-ink:#5d4300;
  --paper:#fffaf2;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font:400 1rem/1.6 var(--font)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent-text)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-weight:800;margin:0;text-wrap:pretty}
p{margin:0}
.main{max-width:1180px;margin:0 auto;padding:0 16px 48px}

/* 版頭：深藍滿版，和黑鮪魚網頁一樣 */
.top{background:var(--brand);color:#fff;position:relative;z-index:20}
@media (min-width:760px){.top{position:sticky;top:0}}
@media (max-height:500px){.top{position:relative}}  /* 手機橫放、放大很多倍時版頭不要黏住，空間留給內容 */
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;min-height:64px;display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0;flex:1 1 0;min-height:44px;color:#fff;text-decoration:none}
.brand > span{min-width:0}
.brand svg{flex:none;color:var(--edge)}
.brand b{display:block;font-size:1.15rem;line-height:1.25}
.brand small{display:block;color:rgba(255,255,255,.78);font-size:.78rem;line-height:1.3}
.top nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
@media (max-width:759px){.top nav{order:3;width:100%}}
.hbtn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:6px 14px;border:2px solid rgba(255,255,255,.6);border-radius:12px;background:transparent;color:#fff;font-weight:700;font-size:.95rem;text-decoration:none;white-space:nowrap;flex:none}
.hbtn.pill{border-radius:999px}
.hbtn[aria-current="page"]{background:#fff;border-color:#fff;color:var(--brand)}

/* 共用 */
.page-head{display:grid;gap:8px;margin:20px 0 12px}
.page-head h1{font-size:clamp(1.6rem,4.5vw,2.1rem)}
.lead{color:var(--muted);max-width:62ch}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note{color:var(--muted);font-size:.88rem}
.pending{color:var(--muted)}
/* 選項按鈕：選到的是藍色加 ✓，橘色只給下一步要按的按鈕 */
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:44px;padding:6px 12px;border:2px solid var(--line-2);border-radius:12px;background:var(--surface);color:var(--ink);font-weight:700;line-height:1.3}
.seg button[aria-pressed="true"]{background:var(--pick);border-color:var(--pick);color:var(--pick-ink);font-weight:800}
.seg button[aria-pressed="true"]::before{content:"✓ "}
.chip{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:6px 16px;border:2px solid var(--line-2);border-radius:999px;background:var(--surface);color:var(--ink);font-weight:700;font-size:.92rem;text-decoration:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:8px 16px;border:2px solid var(--line-2);border-radius:12px;background:var(--surface);color:var(--ink);font-weight:700;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:800}
.tag{display:inline-block;font-size:.78rem;line-height:1.5;padding:1px 9px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink);white-space:nowrap}
.st{display:inline-block;font-size:.78rem;line-height:1.5;padding:1px 9px;border-radius:999px;font-weight:700;white-space:nowrap}
.st.todo{background:var(--surface-2);color:var(--muted)}
.st.trying{background:var(--warn-bg);color:var(--warn-ink)}
.st.ready{background:var(--leaf-soft);color:var(--leaf-ink)}
.tier-s{--tc:var(--leaf)} .tier-b{--tc:var(--sea)} .tier-a{--tc:var(--accent)}
.foot{margin-top:40px;color:var(--muted);font-size:.82rem;display:grid;gap:4px;justify-items:start}
.foot .chip{margin-top:6px}

/* 課程清單 */
.stats{display:flex;gap:6px;flex-wrap:wrap}
.filters{display:grid;gap:10px;margin:16px 0 6px}
.frow{display:flex;align-items:center;gap:8px}
.frow > span{color:var(--muted);font-size:.88rem;min-width:2.6em;flex:none}
.mach{display:flex;align-items:baseline;gap:10px;margin:28px 0 4px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.mach h2{font-size:1.4rem}
.tier-h{display:flex;align-items:center;gap:8px;margin:16px 0 10px;font-weight:800;font-size:.98rem}
.tier-h i{width:12px;height:12px;border-radius:50%;background:var(--tc)}
.tier-h span{color:var(--muted);font-weight:400}
/* 大圖示卡片：手機一排兩張 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
@media (max-width:560px){.grid{grid-template-columns:1fr 1fr;gap:10px}}
.card{display:grid;gap:10px;align-content:start;padding:10px 10px 12px;border:2px solid var(--line-2);border-radius:var(--r);background:var(--surface);color:inherit;text-decoration:none}
.ico{display:grid;place-items:center;aspect-ratio:16/10;border-radius:10px;color:var(--tc);background:var(--panel);background:color-mix(in srgb,var(--tc) 15%,var(--surface))}
.ico svg{width:46%;height:auto;max-width:96px}
.card .txt{display:block;min-width:0}
.num{display:block;font-family:var(--mono);font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.card b{display:block;font-size:1rem;line-height:1.4;margin:2px 0;text-wrap:pretty}
.prod{display:block;color:var(--muted);font-size:.9rem}
.card .tags{display:flex;gap:4px 6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.open{margin-left:auto;font-size:.84rem;font-weight:800;color:var(--accent-text);white-space:nowrap}

/* 每堂課 */
.back{margin-top:14px}
.chead{display:grid;gap:14px;margin:10px 0 16px}
@media (min-width:760px){.chead{grid-template-columns:1fr 260px;align-items:start}}
.meta{color:var(--muted);font-size:.88rem}
.chead h1{font-size:clamp(1.5rem,4.2vw,2.05rem);line-height:1.35;margin:4px 0 10px}
.prodname{font-weight:800}
.hero{margin:0;display:grid;place-items:center;gap:4px;padding:16px;border:2px dashed var(--line-2);border-radius:var(--r);color:var(--tc);background:var(--panel);background:color-mix(in srgb,var(--tc) 12%,var(--surface));text-align:center}
.hero small{color:var(--muted);font-size:.8rem}
@media (max-width:759px){.hero{grid-template-columns:auto 1fr;justify-items:start;text-align:left;gap:12px;padding:10px 14px}.hero svg{width:64px;height:64px}}
.sec{display:grid;gap:10px;margin-top:14px;max-width:880px}
.box{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px 16px;min-width:0}
.box h3{font-size:1.05rem;margin-bottom:8px}
.box > * + *{margin-top:8px}
/* 收合的段落 */
details.box{padding:0}
details.box > summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:10px 16px;border-radius:var(--r)}
details.box > summary::-webkit-details-marker{display:none}
details.box > summary h3{margin:0}
details.box > summary::after{content:"";flex:none;width:9px;height:9px;margin:-4px 4px 0 0;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:rotate(45deg)}
details.box[open] > summary::after{margin-top:4px;transform:rotate(-135deg)}
details.box > .acc-body{display:grid;gap:8px;padding:0 16px 16px}
details.box > .acc-body > *{margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.kv dt{color:var(--muted);white-space:nowrap}
.kv dd{margin:0}
ol.list,ul.list{margin:0;padding-left:1.4em;display:grid;gap:6px}
.levels{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.levels li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.lv{font-size:.8rem;font-weight:800;border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:6px;padding:1px 8px;white-space:nowrap}
.tbl-wrap{overflow-x:auto}
table.tbl{border-collapse:collapse;width:100%}
.tbl th,.tbl td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{color:var(--muted);font-weight:700;font-size:.85rem}
.tbl td.t{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted)}
.tbl tr:last-child td{border-bottom:0}
.tbl td:not(:last-child){white-space:nowrap}

/* 機器設定 */
.fields{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.field{display:grid;gap:4px;align-content:start}
.field > label,.flabel{font-size:.88rem;color:var(--muted)}
.uw{display:flex;align-items:center;gap:6px}
.uw input{flex:1;min-width:0}
.uw span{color:var(--muted);font-size:.88rem}
input[type=number],input[type=text],textarea{background:var(--surface);border:2px solid var(--line-2);border-radius:10px;padding:8px 10px;min-height:48px;width:100%;font-variant-numeric:tabular-nums}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{font-family:var(--mono);font-size:.8rem;min-height:70px;resize:vertical;word-break:break-all}
.calc{display:grid;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.check{display:flex;align-items:center;gap:8px;min-height:44px}
.check input{width:20px;height:20px;accent-color:var(--pick)}
.preview{background:var(--paper);color:var(--paper-ink);border-radius:10px;padding:10px;overflow-x:auto;border:1px solid var(--line)}
.preview svg{display:block;width:100%;height:auto}
.preview .lz path{vector-effect:non-scaling-stroke;stroke-width:1.1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--paper-ink);margin-top:6px}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid;vertical-align:middle;margin-right:4px}
.msg{font-size:.88rem;font-weight:700;color:var(--leaf-ink)}
.msg.bad{color:var(--accent-text)}
.empty{padding:20px}
.step h3{display:flex;align-items:center;gap:8px}
.stepn{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--pick);color:var(--pick-ink);font-size:.9rem;font-weight:800;flex:none}
.mtabs{margin:4px 0 2px}

/* 怎麼用 */
.cards{display:grid;grid-auto-flow:column;grid-auto-columns:100%;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;margin-top:12px;max-width:640px}
.cards::-webkit-scrollbar{display:none}
.hcard{scroll-snap-align:start;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:18px 20px;display:grid;gap:8px;align-content:start;min-height:180px}
.hcard h3{font-size:1.15rem}
.pager{margin-top:12px;max-width:640px;justify-content:space-between}

/* 滑鼠移過去的回饋只給有滑鼠的裝置，觸控螢幕點完不會一直停在變色的樣子 */
@media (hover:hover){
  .hbtn:hover{border-color:#fff}
  .seg button:hover,.chip:hover,.btn:hover,a.card:hover{border-color:var(--pick)}
  .btn.primary:hover{border-color:var(--accent)}
  details.box > summary:hover{background:var(--surface-2)}
}

/* 照片雷雕：沿用課程工具箱的樣式（hub.css），這裡只放這頁才有的東西。
   版面（v0.2）：每一步都在一個畫面內。調整時預覽占滿畫面，設定放在跳出來的視窗：
   手機從下面出來、可以往下滑關掉；電腦和平板的調整視窗在右邊（不擋預覽），說明類的視窗在中間，都按「關閉」。 */
[hidden]{display:none!important}
.top-in{flex-wrap:nowrap}
.top .wide-only{display:none}
@media (min-width:760px){.top span.wide-only{display:inline}.top .brand small.wide-only{display:block}}

/* 步驟列 */
.pt-steps{display:flex;gap:6px;margin:10px 0 4px}
.pt-steps button{flex:1 1 0;min-height:48px;padding:6px 8px;border:2px solid var(--line-2);border-radius:12px;background:var(--surface);color:var(--ink);font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px}
.pt-steps button i{font-style:normal;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--surface-2);font-size:.9rem}
.pt-steps button[aria-current="step"]{background:var(--pick);border-color:var(--pick);color:var(--pick-ink)}
.pt-steps button[aria-current="step"] i{background:rgba(255,255,255,.22)}
.pt-steps button[aria-disabled="true"]{background:var(--surface-2);border-style:dashed;color:var(--muted)}
.stephint:empty{display:none}
body[data-step="2"] .main{padding-bottom:12px}

/* 第 1 步 */
.start{display:grid;gap:14px;max-width:680px;margin:10px auto 0}
.outrow{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
.start .row.big{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bigbtn{min-height:60px;font-size:1.08rem;padding:10px 16px}
.warn{margin:0;padding:10px 14px;border-radius:10px;background:var(--warn-bg);color:var(--warn-ink);font-weight:700}

/* 第 2 步：預覽＋工具列 */
.editor{display:grid;gap:8px;margin-top:8px}
@media (min-width:760px){.editor{max-width:900px;margin-inline:auto}}
.ed-modes{display:flex;justify-content:center}
.stage{display:grid;place-items:center;height:360px;padding:8px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.pvc{display:block;max-width:100%;cursor:grab;border-radius:6px}
.stage.dark{background:#14110d;border-color:#2c261d}  /* 開燈預覽：暗的背景才看得出透光 */
.pvc:active{cursor:grabbing}
.toolbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,1.3fr);gap:8px}
.toolbar .btn{min-height:52px;padding:6px 8px}
.toolbar .tool[aria-pressed="true"]{background:var(--pick);border-color:var(--pick);color:var(--pick-ink)}
.toolbar .tool[aria-pressed="true"]::before{content:"✓ "}
/* 手機打開調整視窗時，版頭、步驟和工具列先收起來，預覽留在視窗上面 */
@media (max-width:759px){body.sheet-adjust .top,body.sheet-adjust .pt-steps,body.sheet-adjust .stephint,body.sheet-adjust .toolbar{display:none}}

/* 跳出來的視窗 */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;flex-direction:column;gap:12px;max-height:84dvh;overflow:auto;overscroll-behavior:contain;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));background:var(--surface);color:var(--ink);border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.32)}
.sheet.side{max-height:60dvh}
.sheet.swipe{touch-action:pan-y}
.sheet.swipe::before{content:"";display:block;flex:none;width:40px;height:5px;border-radius:3px;background:var(--line-2);align-self:center;margin:-6px 0 -2px}
.sheet.enter{animation:sheetUp .22s ease-out}
@keyframes sheetUp{from{translate:0 100%}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet-head h2{font-size:1.15rem}
.sheet-head .seg{flex-wrap:nowrap}
.sheet-body{display:grid;gap:10px}
.btn.soft{background:var(--surface-2);border-color:var(--surface-2);flex:none}
.srow{display:grid;grid-template-columns:3.6em minmax(0,1fr);align-items:center;gap:10px}
.srow > b{font-size:.95rem}
.srow > b small{display:block;font-size:.78rem;font-weight:400;color:var(--muted)}
.range{display:flex;align-items:center;gap:10px}
.range input[type=range]{flex:1;min-width:0;height:44px;accent-color:var(--pick)}
.range output{min-width:2.4em;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.scrim{position:fixed;inset:0;z-index:39;background:rgba(10,12,10,.5)}
.toc{display:flex;flex-wrap:wrap;gap:6px}
@media (min-width:760px), (max-height:500px) and (min-width:600px){
  .sheet{left:50%;right:auto;top:50%;bottom:auto;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 32px));max-height:calc(100dvh - 48px);border:1px solid var(--line);border-radius:14px;padding-bottom:16px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
  .sheet.enter{animation:none}
  .sheet.side{left:auto;right:16px;top:80px;bottom:16px;transform:none;width:360px;max-height:none}
  body.sheet-adjust .main{padding-right:392px}
}
/* 又矮又寬：預覽在左，預覽方式和工具列在右；打開調整視窗時工具列先收起來 */
@media (max-height:500px) and (min-width:600px){
  .sheet.side{top:12px;bottom:12px;padding-top:10px;padding-bottom:10px;gap:8px}
  .sheet.side .sheet-body{gap:8px}
  body.sheet-adjust .top,body.sheet-adjust .pt-steps,body.sheet-adjust .stephint{display:none}
  .editor{grid-template-columns:minmax(0,1fr) minmax(170px,220px);grid-template-rows:auto minmax(0,1fr);align-items:start;max-width:none}
  .stage{grid-column:1;grid-row:1 / span 2}
  .ed-modes{grid-column:2;grid-row:1;justify-content:stretch}
  .ed-modes .seg{width:100%}
  .ed-modes .seg button{flex:1 1 auto}
  .toolbar{grid-column:2;grid-row:2;grid-template-columns:repeat(3,minmax(0,1fr))}
  .toolbar .btn.primary{grid-column:1 / -1}
  body.sheet-adjust .editor{grid-template-columns:minmax(0,1fr)}
  body.sheet-adjust .ed-modes{grid-column:1;grid-row:1;justify-content:center}
  body.sheet-adjust .ed-modes .seg{width:auto}
  body.sheet-adjust .stage{grid-column:1;grid-row:2}
  body.sheet-adjust .toolbar{display:none}
  .sheet[data-kind="advanced"]{width:min(760px,calc(100vw - 32px))}
  .sheet[data-kind="advanced"] .sheet-body{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
}
@media (prefers-reduced-motion:reduce){.sheet.enter{animation:none}}

/* 第 3 步 */
.dl{display:grid;gap:14px;max-width:640px;margin:10px auto 0}
.dl input[type=text]{max-width:320px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-weight:700}
.out-in{display:grid;gap:10px}
@media (min-width:520px){.out-in{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);align-items:center}}
.thumb svg{display:block;width:100%;max-width:360px;max-height:180px;height:auto;margin:0 auto}
.thumb canvas{display:block;width:auto;height:auto;max-width:100%;max-height:180px;margin:0 auto;border-radius:8px}

/* 拍攝照片 */
.cam{position:fixed;inset:0;z-index:60;display:grid;grid-template-rows:auto 1fr auto;background:#111;color:#fff}
.cam-bar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--brand)}
.cam-bar b{margin-right:auto;font-size:1.05rem}
.cam-v{display:grid;place-items:center;min-height:0;overflow:hidden}
.cam-v video{width:100%;height:100%;object-fit:contain;background:#000}
.cam-v video.mirror{transform:scaleX(-1)}
.cam-foot{display:grid;gap:8px;justify-items:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.cam-foot .row{justify-content:center}
.cam-foot .msg.bad{color:#ffb08a}
.shutter{min-width:200px}

<body>
<div id="app"><p style="padding:24px">載入中…</p></div>
<noscript><p style="padding:24px">這個網頁需要開啟 JavaScript。</p></noscript>
<script>
"use strict";
/* ===== 創客小幫手（照片）：拍照或選照片 → 裁成形狀 → 雷射雕刻的點陣（SVG）或 3D 列印的透光片（STL） =====
   照片只在這台電腦處理，不上傳、不存檔；記住的只有形狀、大小這些選項。 */
(() => {
  const VERSION = "0.4.1";

  /* ---------- 小工具 ---------- */
  function h(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") e.className = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? "" : v);
    }
    for (const k of kids.flat(Infinity)) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(String(k)));
    return e;
  }
  const svgEl = markup => { const t = document.createElement("template"); t.innerHTML = markup.trim(); return t.content.firstChild; };
  const store = {
    get(k, d) { try { const v = localStorage.getItem("photo:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("photo:" + k, JSON.stringify(v)); } catch (e) { /* 存不了不影響使用 */ } }
  };
  const f2 = n => String(Math.round(n * 100) / 100);
  const mm1 = n => String(Math.round(n * 10) / 10);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const canvas = (w, hh) => { const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(hh)); return c; };
  const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

  /* 深色／大地色：和黑鮪魚名牌、課程工具箱共用同一個設定 */
  const THEME_KEY = "tuna:theme";
  const themeGet = () => { try { return JSON.parse(localStorage.getItem(THEME_KEY) || '""'); } catch (e) { return ""; } };
  const themeSet = v => { try { localStorage.setItem(THEME_KEY, JSON.stringify(v)); } catch (e) { /* 存不了也沒關係 */ } };
  function applyTheme() { const t = themeGet(); if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
  applyTheme();

  /* 機器設定：課程工具箱存在同一個網站，這裡只讀，用來算立牌底座的插槽 */
  function machine() {
    let o = null; try { o = JSON.parse(localStorage.getItem("courses:machine") || "null"); } catch (e) { o = null; }
    const key = o && o.active === "base" ? "base" : "school", p = (o && o.p && o.p[key]) || {};
    const num = (v, d) => (typeof v === "number" && isFinite(v) && v > 0 ? v : d);
    return { found: !!(o && o.p), name: key === "base" ? "基地" : "學校", s3: num(p.s3, 3.0), s5: num(p.s5, 5.0), bump: p.bump === true, bumpD: num(p.bumpD, 1.0) };
  }

  /* ---------- 選項 ---------- */
  const KINDS = { charm: "吊飾", stand: "立牌", plain: "純圖案" };
  const SHAPES = { circle: "圓形", heart: "愛心", square: "方形", rect: "長方形" };
  const SHAPES_FOR = { charm: ["circle", "heart", "square"], stand: ["rect", "square", "circle"], plain: ["circle", "heart", "square", "rect"] };
  const SIZES = [40, 50, 60, 80, 100];
  const STYLES = { dots: "點陣（細緻）", clean: "點陣（清晰）", bw: "黑白（剪影）", gray: "灰階（由 Beam Studio 轉換）" };
  const DEF = { out: "laser", kind: "charm", shape: "circle", size: 50, orient: "portrait", bright: 58, contrast: 55, fade: false, frame: false, style: "dots", dpi: 250, board: 3 };
  /* 3D 透光片：款式另外記，切換製作方式時兩邊的設定都留著 */
  const OUTS = { laser: "雷射雕刻", litho: "3D 透光片" };
  const LKINDS = { curve: "弧形", stand: "立牌", charm: "吊飾", plain: "純圖案" };
  const LKIND_FULL = { curve: "弧形立牌", stand: "立牌", charm: "吊飾", plain: "純圖案" };
  const LSHAPES_FOR = { curve: ["rect", "square"], stand: ["rect", "square", "circle"], charm: ["circle", "heart", "square"], plain: ["circle", "heart", "square", "rect"] };
  const LSIZES = [40, 50, 60, 80];
  const LTHICK = { std: [0.8, 3.0], thin: [0.6, 2.4] };
  const LDEF = { kind: "curve", shape: "rect", size: 60, orient: "landscape", frame: true, thick: "std" };
  const O = Object.assign({}, DEF, store.get("opts", {}));
  if (!KINDS[O.kind]) O.kind = DEF.kind;
  if (!SHAPES_FOR[O.kind].includes(O.shape)) O.shape = SHAPES_FOR[O.kind][0];
  if (!SIZES.includes(O.size)) O.size = DEF.size;
  if (!STYLES[O.style]) O.style = DEF.style;
  if (![250, 500].includes(O.dpi)) O.dpi = DEF.dpi;
  if (![3, 5].includes(O.board)) O.board = DEF.board;
  if (!["portrait", "landscape"].includes(O.orient)) O.orient = DEF.orient;
  for (const k of ["bright", "contrast"]) O[k] = clamp(+O[k] || DEF[k], 0, 100);
  if (!OUTS[O.out]) O.out = DEF.out;
  O.L = Object.assign({}, LDEF, O.L && typeof O.L === "object" ? O.L : {});
  if (!LKINDS[O.L.kind]) O.L.kind = LDEF.kind;
  if (!LSHAPES_FOR[O.L.kind].includes(O.L.shape)) O.L.shape = LSHAPES_FOR[O.L.kind][0];
  if (!LSIZES.includes(O.L.size)) O.L.size = LDEF.size;
  if (!["portrait", "landscape"].includes(O.L.orient)) O.L.orient = LDEF.orient;
  if (!LTHICK[O.L.thick]) O.L.thick = LDEF.thick;
  O.L.frame = O.L.frame !== false;
  try { const q = new URLSearchParams(location.search).get("out"); if (OUTS[q]) O.out = q; } catch (e) { /* 網址參數讀不到就用記住的 */ }
  const save = () => store.set("opts", O);
  const isL = () => O.out === "litho";
  const P = () => (isL() ? O.L : O);  /* 目前製作方式的款式設定 */
  const kindsNow = () => (isL() ? LKINDS : KINDS);
  const shapesFor = k => (isL() ? LSHAPES_FOR : SHAPES_FOR)[k];
  const sizesNow = () => (isL() ? LSIZES : SIZES);

  /* ---------- 形狀（單位 mm，原點在左上角） ---------- */
  const MARGIN = 1.0, RING = 0.8, RING_GAP = 1.0, HOLE_R = 2.0, HOLE_KEEP = 3.6;
  function circlePts(cx, cy, r, a0, a1, n) { const p = []; for (let i = 0; i <= n; i++) { const t = a0 + (a1 - a0) * i / n; p.push([cx + r * Math.cos(t), cy + r * Math.sin(t)]); } return p; }
  function rrPts(w, hh, r) {  /* 圓角長方形，順時針：上 → 右 → 下 → 左 */
    const n = 10, p = [], c = [[w - r, r, -Math.PI / 2], [w - r, hh - r, 0], [r, hh - r, Math.PI / 2], [r, r, Math.PI]];
    for (const [cx, cy, a] of c) p.push(...circlePts(cx, cy, r, a, a + Math.PI / 2, n));
    return p;
  }
  function heartRaw() {
    if (heartRaw.r) return heartRaw.r;
    const raw = [];
    for (let i = 0; i < 240; i++) { const t = i / 240 * Math.PI * 2, s = Math.sin(t); raw.push([16 * s * s * s, -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))]); }
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    for (const [x, y] of raw) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
    return (heartRaw.r = { raw, x0, x1, y0, y1 });
  }
  /* 原始座標 → 實際大小；(0, 0) 在愛心中間（從這裡看得到整個邊），(0, -5) 是上面的凹口 */
  const heartMap = (w, hh) => { const R = heartRaw(); return ([x, y]) => [(x - R.x0) / (R.x1 - R.x0) * w, (y - R.y0) / (R.y1 - R.y0) * hh]; };
  const heartPts = (w, hh) => heartRaw().raw.map(heartMap(w, hh));
  function geom() {
    if (isL()) return geomL();
    const W = O.size, kind = O.kind, shape = O.shape, M = machine();
    let H, outline;
    if (shape === "circle") { H = W; outline = circlePts(W / 2, W / 2, W / 2, 0, Math.PI * 2, 180).slice(0, -1); }
    else if (shape === "heart") { H = Math.round(W * 0.9 * 10) / 10; outline = heartPts(W, H); }
    else if (shape === "square") { H = W; outline = rrPts(W, W, W * 0.12); }
    else { H = Math.round((O.orient === "landscape" ? W * 0.75 : W * 4 / 3) * 10) / 10; outline = rrPts(W, H, Math.min(4, W * 0.06)); }
    const G = { W, H, Hfull: H, outline, full: outline, hole: null, base: null, tab: null, shape, kind };
    if (kind === "charm") { const at = shape === "heart" ? [W * 0.27, H * 0.21] : [W / 2, Math.max(4.6, H * 0.09)]; G.hole = { x: at[0], y: at[1], r: HOLE_R }; }
    if (kind === "stand") {
      const T = O.board, sw = T === 5 ? M.s5 : M.s3;
      let tw, full, yb;
      if (shape === "circle") {
        const R = W / 2; tw = clamp(R * 0.5, 10, 22);
        const t0 = Math.acos(tw / 2 / R), ys = R + R * Math.sin(t0); yb = ys + T;
        full = circlePts(R, R, R, Math.PI - t0, t0 + Math.PI * 2, 180);
        full.push([R + tw / 2, yb], [R - tw / 2, yb]);
      } else {
        tw = clamp(W * 0.45, 12, 36); yb = H + T;
        full = []; const n = outline.length / 4;  /* 四個角各 n 點：下邊在第 2、3 個角之間 */
        outline.forEach((p, i) => { full.push(p); if (i === n * 2 - 1) full.push([W / 2 + tw / 2, H], [W / 2 + tw / 2, yb], [W / 2 - tw / 2, yb], [W / 2 - tw / 2, H]); });
      }
      G.full = full; G.Hfull = yb; G.tab = { w: tw, h: T };
      const Wb = Math.round(clamp(W * 0.9, tw + 20, W + 10)), Db = Math.round(clamp(G.Hfull * 0.32, 24, 40)), L = tw + 0.4;
      G.base = { W: Wb, D: Db, slotL: L, slotW: sw, bump: M.bump ? M.bumpD : 0, outline: rrPts(Wb, Db, 4), M };
    }
    return G;
  }
  /* 透光片：長方形、方形是直角；外框 2.5 mm 一律最厚 */
  function geomL() {
    const L = O.L, W = L.size, shape = L.shape, [t0, t1] = LTHICK[L.thick];
    let H, outline, c = null;
    if (shape === "circle") { H = W; outline = circlePts(W / 2, W / 2, W / 2, 0, Math.PI * 2, 360).slice(0, -1); c = [W / 2, W / 2]; }
    else if (shape === "heart") { H = Math.round(W * 0.9 * 10) / 10; outline = heartPts(W, H); c = heartMap(W, H)([0, 0]); }
    else { H = shape === "square" ? W : Math.round((L.orient === "landscape" ? W * 0.75 : W * 4 / 3) * 10) / 10; outline = [[0, 0], [W, 0], [W, H], [0, H]]; }
    const G = { litho: true, kind: L.kind, shape, W, H, Hfull: H, outline, full: outline, hole: null, base: null, tab: null, c, t0, t1, fw: L.frame ? 2.5 : 0, curve: L.kind === "curve", foot: null, loop: null };
    if (L.kind === "stand") G.foot = { h: 4, d: Math.round(clamp(H * 0.12, 6, 12)), sink: shape === "circle" ? 2.5 : 1.5, w: shape === "circle" ? Math.round(W * 0.7) : W };
    if (L.kind === "charm") G.loop = { cx: W / 2, cy: -3, a: 3.5, r: 1.8, yb: (shape === "heart" ? heartMap(W, H)([0, -5])[1] : 0) + 2 };
    G.vb = [G.foot ? Math.min(0, W / 2 - G.foot.w / 2) : 0, G.loop ? G.loop.cy - G.loop.a : 0, G.foot ? Math.max(W, W / 2 + G.foot.w / 2) : W, G.foot ? H - G.foot.sink + G.foot.h : H];
    return G;
  }

  /* ---------- 照片和裁切 ---------- */
  let IMG = null, imgSeq = 0;  // IMG: { c: canvas, w, h, sample, id }
  const crop = { z: 1, cx: 0, cy: 0 };
  function cropRect(G) {
    const sMax = Math.min(IMG.w / G.W, IMG.h / G.H), s = sMax / crop.z, sw = G.W * s, sh = G.H * s;
    crop.cx = clamp(crop.cx, sw / 2, IMG.w - sw / 2); crop.cy = clamp(crop.cy, sh / 2, IMG.h - sh / 2);
    return { sx: crop.cx - sw / 2, sy: crop.cy - sh / 2, sw, sh };
  }
  function setImage(src, w, hh, sample) {
    const k = Math.min(1, 2400 / Math.max(w, hh)), c = canvas(w * k, hh * k), x = c.getContext("2d");
    x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height);
    x.drawImage(src, 0, 0, c.width, c.height);
    IMG = { c, w: c.width, h: c.height, sample: !!sample, id: ++imgSeq };
    crop.z = 1; crop.cx = c.width / 2; crop.cy = c.height / 2;
    syncZoom(); go(2);
  }
  function rotateImage() {
    if (!IMG) return;
    const c = canvas(IMG.h, IMG.w), x = c.getContext("2d");
    x.translate(c.width, 0); x.rotate(Math.PI / 2); x.drawImage(IMG.c, 0, 0);
    IMG = { c, w: c.width, h: c.height, sample: IMG.sample, id: ++imgSeq };
    crop.cx = c.width / 2; crop.cy = c.height / 2; schedule(false);
  }
  function loadFile(file) {
    if (!file) return;
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); setImage(img, img.naturalWidth, img.naturalHeight, false); };
    img.onerror = () => { URL.revokeObjectURL(url); say(startMsg, "無法開啟這張照片，請改用 JPG 或 PNG 格式。", true); };
    img.src = url;
  }
  /* 試刻卡：10 格灰階＋漸層＋圓球，第一次刻新木板時先刻這張，看哪個亮度最好 */
  function testCard() {
    const N = 900, c = canvas(N, N), x = c.getContext("2d");
    x.fillStyle = "#fff"; x.fillRect(0, 0, N, N);
    const cell = 150, gx = 75;
    for (let i = 0; i < 10; i++) {
      const v = Math.round(255 * i / 9), col = i % 5, row = Math.floor(i / 5), px = gx + col * cell, py = 60 + row * (cell + 20);
      x.fillStyle = `rgb(${v},${v},${v})`; x.fillRect(px, py, cell - 10, cell - 10);
      x.fillStyle = v < 128 ? "#fff" : "#000"; x.font = "bold 54px sans-serif"; x.textAlign = "center"; x.textBaseline = "middle";
      x.fillText(String(i + 1), px + (cell - 10) / 2, py + (cell - 10) / 2);
    }
    const gr = x.createLinearGradient(gx, 0, N - gx, 0); gr.addColorStop(0, "#000"); gr.addColorStop(1, "#fff");
    x.fillStyle = gr; x.fillRect(gx, 420, N - 2 * gx, 90);
    const rg = x.createRadialGradient(330, 610, 20, 420, 690, 190); rg.addColorStop(0, "#fff"); rg.addColorStop(0.6, "#888"); rg.addColorStop(1, "#111");
    x.fillStyle = rg; x.beginPath(); x.arc(420, 690, 170, 0, Math.PI * 2); x.fill();
    x.fillStyle = "#000"; x.font = "bold 46px sans-serif"; x.textAlign = "left"; x.fillText("試刻卡", 640, 650); x.font = "34px sans-serif"; x.fillText("比對各格", 640, 710); x.fillText("的深淺", 640, 755);
    O.kind = "plain"; O.shape = "square"; O.size = 50; save();
    setImage(c, N, N, true);
  }

  /* ---------- 轉成雷射的點點 ---------- */
  function shapePath(G, s) {
    const p = new Path2D();
    if (G.shape === "circle") p.arc(G.W / 2 * s, G.H / 2 * s, G.W / 2 * s, 0, Math.PI * 2);
    else { G.outline.forEach(([x, y], i) => (i ? p.lineTo(x * s, y * s) : p.moveTo(x * s, y * s))); p.closePath(); }
    return p;
  }
  function maskOf(nx, ny, path, erode, holes) {
    const c = canvas(nx, ny), x = c.getContext("2d");
    x.fillStyle = "#fff"; x.fill(path);
    x.globalCompositeOperation = "destination-out";
    if (erode > 0) { x.lineWidth = erode * 2; x.lineJoin = "round"; x.strokeStyle = "#000"; x.stroke(path); }
    for (const o of holes || []) { x.beginPath(); x.arc(o.x, o.y, o.r, 0, Math.PI * 2); x.fill(); }
    const d = x.getImageData(0, 0, nx, ny).data, m = new Uint8Array(nx * ny);
    for (let i = 0; i < m.length; i++) m[i] = d[i * 4 + 3] > 127 ? 1 : 0;
    return m;
  }
  function compute(G, dpi) {
    const ppm = dpi / 25.4, nx = Math.max(8, Math.round(G.W * ppm)), ny = Math.max(8, Math.round(G.H * ppm)), n = nx * ny;
    const path = shapePath(G, ppm), keep = G.hole ? [{ x: G.hole.x * ppm, y: G.hole.y * ppm, r: HOLE_KEEP * ppm }] : null;
    const inner = maskOf(nx, ny, path, (O.frame ? MARGIN + RING + RING_GAP : MARGIN) * ppm, keep);
    let ring = null;
    if (O.frame) {
      const a = maskOf(nx, ny, path, MARGIN * ppm, keep), b = maskOf(nx, ny, path, (MARGIN + RING) * ppm, null);
      ring = new Uint8Array(n); for (let i = 0; i < n; i++) ring[i] = a[i] && !b[i] ? 1 : 0;
    }

    const switchCam = async () => { facing = facing === "user" ? "environment" : "user"; try { await start(); } catch (e) { say(camMsg, "沒有其他鏡頭。", true); facing = "user"; try { await start(); } catch (e2) { /* 原本的鏡頭也無法開啟 */ } } };
    const layer = h("div", { class: "cam", role: "dialog", "aria-modal": "true", "aria-label": "拍攝照片" },
      h("div", { class: "cam-bar" }, h("b", null, "拍攝照片"), h("button", { type: "button", class: "hbtn", onclick: () => closeCam() }, "取消")),
      h("div", { class: "cam-v" }, video),
      h("div", { class: "cam-foot" }, camMsg,
        h("div", { class: "row" }, h("button", { type: "button", class: "hbtn", onclick: switchCam }, "切換鏡頭"), h("button", { type: "button", class: "btn primary bigbtn shutter", onclick: shoot }, "拍攝"))));
    document.body.append(layer);
    layer.querySelector(".shutter").focus();
  }

  /* ---------- 使用說明 ---------- */
  const HELP_L = [
    ["選擇照片", "「拍攝照片」使用 Chromebook 或手機的鏡頭；「選擇照片」從裝置中選取。主角清楚、背景單純的照片效果最好。"],
    ["調整位置", "在預覽畫面上拖曳可移動照片；兩指、滑鼠滾輪或「位置」中的縮放可調整大小。切換為「照片與範圍」可確認列印範圍。"],
    ["開燈與關燈", "「開燈」顯示放在燈前的樣子；「關燈」顯示平常的樣子，只看得到淡淡的起伏。主角過暗時，在「明暗」中調高亮度。"],
    ["款式", "弧形立牌彎成弧形，可自己站立；立牌附底座；吊飾附吊環，可掛在窗邊。"],
    ["下載", "在「下載」步驟按「下載 STL」，交由老師以切片軟體列印。建議的設定請見下載頁的「列印設定」。"],
  ];
  const HELP = [
    ["選擇照片", "「拍攝照片」使用 Chromebook 或手機的鏡頭；「選擇照片」從裝置中選取。主角約占畫面一半、背景單純、光線充足時，雕刻效果最清楚。"],
    ["調整位置", "在預覽畫面上拖曳可移動照片；兩指、滑鼠滾輪或「位置」中的縮放可調整大小。切換為「照片與切割線」可確認切割範圍。"],
    ["調整明暗", "在「明暗」中調整：主角過暗時調高亮度，整體偏灰時調高對比；背景雜亂時可開啟「邊緣淡化」。"],
    ["下載", "在「下載」步驟按「下載 SVG」。檔案包含照片（雕刻）與紅色切割線，交由老師以 Beam Studio 雕刻。"],
    ["教師設定", "Beam Studio 的雕刻解析度選擇「中」（250 DPI），照片的「漸層」關閉。更換木板時，先雕刻試刻卡或 40 mm 試片，確認合適的亮度。"],
  ];
  function helpBody() {
    const HELP_NOW = isL() ? HELP_L : HELP;
    const track = h("div", { class: "cards", tabindex: "0", role: "region", "aria-label": "使用說明" },
      ...HELP_NOW.map(([t, x], i) => h("article", { class: "hcard" }, h("span", { class: "num" }, `${i + 1} / ${HELP_NOW.length}`), h("h3", null, t), h("p", null, x))));
    const goCard = d => track.scrollBy({ left: d * track.clientWidth, behavior: reduced() ? "auto" : "smooth" });
    track.addEventListener("keydown", e => { if (e.key === "ArrowRight") goCard(1); if (e.key === "ArrowLeft") goCard(-1); });
    return [
      h("div", { class: "toc" }, ...HELP_NOW.map(([t], i) => h("button", { type: "button", class: "chip", onclick: () => track.scrollTo({ left: i * track.clientWidth, behavior: reduced() ? "auto" : "smooth" }) }, t))),
      track,
      h("div", { class: "row pager" }, h("button", { type: "button", class: "btn", onclick: () => goCard(-1) }, "‹ 上一則"), h("button", { type: "button", class: "btn", onclick: () => goCard(1) }, "下一則 ›")),
      h("p", { class: "note" }, `版本 v${VERSION} 試用版`)];
  }

  const brandName = h("b"), brandSub = h("small", { class: "wide-only" });
  root.replaceChildren(
    h("header", { class: "top" }, h("div", { class: "top-in" },
      h("div", { class: "brand" }, svgEl(LOGO), h("span", null, brandName, brandSub)),
      h("button", { type: "button", class: "hbtn", onclick: () => openSheet("help") }, "使用說明"))),
    h("main", { class: "main" }, stepNav, stepHint, s1, s2, s3));
  document.body.append(scrim, sheetEl);
  footSlot.replaceChildren(foot());
  applyOut(); toolbarRedraw(); drawSteps(); go(1);
  window.PHOTO = { O, geom, compute: G => compute(G || geom(), O.dpi), buildSVG: () => { const G = geom(); return buildSVG(G, exportCanvas(G).toDataURL("image/png")); }, testCard, VERSION, crop, openSheet, closeSheet, setOut,
    meshStats: () => meshStats(meshNow()), stl: () => stlBuffer(meshNow()) };
})();

</script>
